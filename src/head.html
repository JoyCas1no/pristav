<title>Пристав: смена</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Смена пристава в вымышленном Заречинске: вид из глаз у двери должника; вертикальный экран телефона. */
:root {
  --bg: #15171d; --panel: #e9e1c9; --ink: #23201a; --muted: #6d6552; --gold: #d9a441; --red: #c4473a; --green: #4f9a63; --line: #3a3d48;
  --font-display: "Press Start 2P", "Courier New", monospace; --font-body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--panel); font-family: var(--font-body); font-size: 21px; line-height: 1.15; padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
#app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.hud { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; font-family: var(--font-display); font-size: 6px; min-height: 0; }
.hud div { background: #20232c; border: 2px solid var(--line); padding: 5px 2px; text-align: center; min-width: 0; overflow: hidden; }
.hud b { display: block; font-size: 8px; color: var(--gold); margin-top: 4px; font-weight: normal; }
.hud .bad b { color: var(--red); }
.where { font-family: var(--font-display); font-size: 8px; color: #8d93a6; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#snd { min-height: 32px; min-width: 44px; padding: 4px 8px; text-align: center; font-size: 12px; }
canvas#scene { width: 100%; image-rendering: pixelated; border: 3px solid var(--line); background: #000; display: block; aspect-ratio: 4 / 3; }
.panel { background: var(--panel); color: var(--ink); border: 3px solid #1b1914; box-shadow: 4px 4px 0 #000; padding: 10px 12px; }
.panel h2 { font-family: var(--font-display); font-size: 11px; line-height: 1.5; margin: 0 0 8px; color: #7a2f26; text-wrap: balance; }
.panel p { margin: 0 0 8px; font-size: 22px; }
.panel p.who { color: var(--muted); font-size: 19px; }
.panel q { display: block; margin: 6px 0; padding-left: 8px; border-left: 4px solid var(--gold); quotes: none; }
.panel ul { margin: 4px 0 0; padding-left: 18px; font-size: 19px; }
.actions { display: flex; flex-direction: column; gap: 6px; }
button { font-family: var(--font-display); font-size: 10px; line-height: 1.5; min-height: 48px; padding: 8px 10px; text-align: left; color: var(--panel); background: #2c3040; border: 3px solid #0c0d11; box-shadow: 3px 3px 0 #000; cursor: pointer; }
button:hover { background: #363b50; }
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button.primary { background: var(--gold); color: #1c1608; }
button.danger { background: #6d2a24; }
button:disabled { opacity: .45; cursor: default; }
.docs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.doc { background: #f7f2e1; border: 2px dashed #8d8468; padding: 6px 8px; font-size: 20px; min-width: 0; overflow-wrap: anywhere; }
.doc.wide { grid-column: 1 / -1; }
.doc h3 { margin: 0 0 4px; font-family: var(--font-display); font-size: 8px; color: #7a2f26; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
.item { min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; text-align: center; background: #f3ecd4; color: var(--ink); border: 3px solid #1b1914; box-shadow: 2px 2px 0 #000; font-family: var(--font-body); font-size: 18px; line-height: 1; }
.item canvas { width: 48px; height: 48px; image-rendering: pixelated; }
.item.on { background: var(--gold); }
.item small { font-family: var(--font-body); font-size: 17px; color: #5b543f; }
.item.on small { color: #3a2c05; }
.note { background: #f3ecd4; border: 2px solid #8d8468; padding: 6px 8px; font-size: 19px; margin-bottom: 8px; }
.tag { font-family: var(--font-display); font-size: 8px; padding: 3px 5px; border: 2px solid; display: inline-block; margin: 0 4px 4px 0; }
.tag.ok { color: #2f6b40; border-color: #2f6b40; }
.tag.bad { color: #9b2f25; border-color: #9b2f25; }
.bars { display: grid; gap: 8px; margin-bottom: 8px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 20px; }
.bar i { grid-column: 1 / -1; height: 10px; background: #cfc6a8; border: 2px solid #1b1914; position: relative; display: block; }
.bar i span { position: absolute; inset: 0 auto 0 0; background: var(--green); }
.bar.low i span { background: var(--red); }
@media (prefers-reduced-motion: no-preference) { .panel { animation: rise .18s steps(3); } }
@keyframes rise { from { transform: translateY(6px); opacity: .4; } }
</style>
<div id="app">
  <div class="where"><span id="whereL"></span><span id="whereR"></span><button id="snd" aria-label="Звук">♪</button></div>
  <div class="hud" id="hud"></div>
  <canvas id="scene" width="96" height="72"></canvas>
  <div class="panel" id="panel"></div>
  <div class="actions" id="actions"></div>
</div>
