const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// ---------- рисование ----------
const cv = $("#scene"), g = cv.getContext("2d");
g.imageSmoothingEnabled = false;
function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function person(p, ox, oy) {
  R(ox - 14, oy + 20, 28, 30, p.shirt);
  R(ox - 14, oy + 20, 28, 3, "rgba(0,0,0,.2)");
  if (p.extra === "scarf") R(ox - 9, oy + 18, 18, 4, "#d04a4a");
  if (p.extra === "tie") R(ox - 2, oy + 22, 4, 14, "#1a1a22");
  R(ox - 8, oy, 16, 20, p.skin);
  R(ox - 8, oy, 16, 2, "rgba(0,0,0,.08)");
  if (p.style === "bun") { R(ox - 9, oy - 3, 18, 6, p.hair); R(ox - 4, oy - 7, 8, 5, p.hair); }
  else if (p.style === "long") { R(ox - 9, oy - 3, 18, 6, p.hair); R(ox - 10, oy - 1, 4, 24, p.hair); R(ox + 6, oy - 1, 4, 24, p.hair); }
  else { R(ox - 9, oy - 3, 18, 6, p.hair); }
  R(ox - 5, oy + 8, 3, 3, "#1a1a22"); R(ox + 2, oy + 8, 3, 3, "#1a1a22");
  R(ox - 3, oy + 15, 6, 1, "#7a3a32");
  if (p.extra === "glasses") { R(ox - 6, oy + 7, 5, 1, "#2b2b33"); R(ox + 1, oy + 7, 5, 1, "#2b2b33"); R(ox - 6, oy + 7, 1, 5, "#2b2b33"); R(ox + 5, oy + 7, 1, 5, "#2b2b33"); }
}
function door(p) {
  R(0, 0, 96, 72, "#4a4a58");
  for (let x = 0; x < 96; x += 8) R(x, 0, 1, 72, "rgba(0,0,0,.12)");

  R(0, 60, 96, 12, "#3a3430");
  if (p) person(p, 48, 26);
  R(14, 8, 3, 64, "#6a4a30"); R(79, 8, 3, 64, "#6a4a30"); R(14, 8, 68, 3, "#6a4a30");
  R(20, 24, 2, 14, "#c8c8d0"); R(18, 22, 6, 2, "#e0e0e8");
}

  R(0, 0, 96, 72, "#7d6f5e");
  for (let y = 0; y < 48; y += 6) R(0, y, 96, 1, "rgba(0,0,0,.1)");
  R(0, 48, 96, 24, "#5a4a3a"); for (let x = 0; x < 96; x += 12) R(x, 48, 1, 24, "rgba(0,0,0,.2)");
  R(60, 8, 26, 24, "#3a2a1e"); R(62, 10, 22, 20, "#78a8d0"); R(72, 10, 2, 20, "#3a2a1e"); R(62, 19, 22, 2, "#3a2a1e");
  R(8, 36, 40, 12, "#6a3a30"); R(8, 30, 40, 6, "#8a4a3a");
  R(16, 40, 14, 20, "rgba(0,0,0,.15)");
}
function court(p) {
  R(0, 0, 96, 72, "#aaa294"); R(0, 0, 96, 6, "#6a6252");
  for (let x = 6; x < 96; x += 20) R(x, 6, 6, 40, "#c8c0b0");
  R(0, 46, 96, 26, "#7a7468"); for (let x = 0; x < 96; x += 16) R(x, 46, 1, 26, "rgba(0,0,0,.2)");
  R(20, 18, 56, 4, "#2a2e3a"); R(20, 18, 4, 36, "#2a2e3a"); R(72, 18, 4, 36, "#2a2e3a");
  R(40, 14, 16, 4, "#d04a3a");
  if (p) person(p, 48, 22);
}
function street() {
  R(0, 0, 96, 72, "#1a1c28");
  for (let i = 0; i < 14; i++) R((i * 37) % 96, (i * 17) % 30, 1, 1, "#f0e8c0");
  R(6, 22, 24, 50, "#272b3c"); R(34, 14, 28, 58, "#2f3447"); R(66, 26, 24, 46, "#252a3a");
  for (let y = 18; y < 68; y += 8) { R(40, y, 4, 4, "#e8c860"); R(50, y, 4, 4, "#e8c860"); R(10, y + 6, 3, 4, "#e8c860"); R(72, y + 2, 3, 4, "#e8c860"); }
  R(0, 66, 96, 6, "#101218"); R(28, 50, 4, 16, "#3a3d4a");
}
function desk() {
  R(0, 0, 96, 72, "#2c3040"); R(0, 44, 96, 28, "#5a4030");
  R(8, 20, 28, 30, "#e0d8b8"); R(12, 26, 20, 2, "#7a7458"); R(12, 32, 20, 2, "#7a7458"); R(12, 38, 14, 2, "#7a7458");
  R(48, 10, 40, 34, "#8a8a98"); R(50, 12, 36, 24, "#5fb3c4");
  R(60, 44, 20, 4, "#2a2a30");
}

// ---------- верхняя панель ----------
function hud() {
  const a = S.stats;
  const h = [
    ["Взыскано", fmt(a.cash), false],
    ["Закон", String(a.law), a.law < 0],
    ["Совесть", String(a.heart), a.heart < 0],
    ["Жалобы", String(a.complaints), a.complaints > 2]
  ];
  $("#hud").innerHTML = h.map(([t, v, bad]) => `<div class="${bad ? "bad" : ""}">${t}<b>${esc(v)}</b></div>`).join("");
}
function where() {
  const st = SCHEDULE[S.step];
  $("#whereL").textContent = "Заречинск · ОПВ № 7";
  $("#whereR").textContent = st ? `Смена · ${st.time}` : "Смена окончена";
}

// ---------- помощники экрана ----------
function setActions(list) {
  const el = $("#actions"); el.innerHTML = "";
  for (const a of list) {
    const b = document.createElement("button");
    b.textContent = a.label; if (a.cls) b.className = a.cls; if (a.disabled) b.disabled = true;
    b.addEventListener("click", a.fn); el.appendChild(b);
  }
}
function panel(html) { $("#panel").innerHTML = html; }

// ---------- главное меню ----------
function menu() {
  S = null; street();
  $("#hud").innerHTML = ""; $("#whereL").textContent = "Заречинск"; $("#whereR").textContent = "ОПВ № 7";
  panel(`<h2>ПРИСТАВ: СМЕНА</h2>
    <p>Один рабочий день. Пять должников, дежурство в здании суда и список, который никогда не кончается.</p>
    <p class="who">Все персонажи и организации вымышлены. 16+: чёрный юмор, без жестокости.</p>`);
  const saved = loadSave();
  const list = [];
  const canContinue = saved && typeof saved.step === "number" && saved.step < SCHEDULE.length;
  if (canContinue) list.push({ label: "Продолжить смену", cls: "primary", fn: () => { S = saved; run(); } });
  list.push({ label: canContinue ? "Новая смена" : "Начать смену", cls: canContinue ? "" : "primary", fn: () => { S = fresh(); run(); } });
  list.push({ label: "Как играть", fn: howTo });
  setActions(list);
}
function howTo() {
  street();
  panel(`<h2>КАК ИГРАТЬ</h2>
    <p>У каждого должника три шага: поговорить у двери, сверить документы, описать имущество.</p>
    <p>Нельзя изымать то, что закон защищает: единственное жильё, бытовую технику, лекарства, детские вещи и рабочие инструменты. За нарушение растут жалобы.</p>
    <p>В суде ловите опасные вещи, но не мучайте честных людей досмотром.</p>
    <p class="who">Цель: собрать ${esc(fmt(PLAN))}, не нарушить закон и не потерять совесть.</p>`);
  setActions([{ label: "Назад", cls: "primary", fn: menu }]);
}

// ---------- основной цикл ----------
function run() {
  writeSave(); hud(); where();
  const st = SCHEDULE[S.step];
  if (!st) return summary();
  if (st.t === "debt") debtScreen(CASES[st.i]); else courtScreen();
}

// ----- должник -----
function debtScreen(c) {
  if (S.phase === "door") {
    door(c.person);
    panel(`<h2>${esc(c.name)}</h2>
      <p class="who">Долг: ${esc(fmt(c.debt))} · Взыскатель: ${esc(c.creditor)}</p>
      <p>${esc(c.intro)}</p><q>${esc(c.line)}</q>`);
    setActions([
      { label: "Строго по протоколу", fn: () => tone(c, "strict") },
      { label: "Поговорить по-человечески", fn: () => tone(c, "kind") },
      { label: "Надавить: «Откройте или взломаем»", cls: "danger", fn: () => tone(c, "hard") }
    ]);
  } else if (S.phase === "talk") {
    door(c.person);
    panel(`<h2>${esc(c.name)}</h2><p>${esc(S.toneText)}</p><div class="note">Заметка: ${esc(c.hint)}</div>`);
    setActions([{ label: "К документам", cls: "primary", fn: () => { S.phase = "docs"; run(); } }]);
  } else if (S.phase === "docs") docs(c);
  else if (S.phase === "inspect") inspect(c);
  else if (S.phase === "result") resultScreen();
}
function tone(c, t) {
  if (t === "strict") { S.toneText = "Вы представились и зачитали постановление. Должник слушает молча, но не спорит."; }
  if (t === "kind") { stat("heart", 1); S.toneText = "Вы присели на табурет и выслушали. Должник заметно расслабился и показал документы без споров."; }
  if (t === "hard") { stat("heart", -1); stat("law", -1); stat("complaints", 1); S.toneText = "Вы пригрозили вскрытием двери. Должник побледнел, но жалобу потом точно напишет."; }
  S.tone = t; S.phase = "talk"; run();
}
function docs(c) {
  door(c.person);
  const p = c.passport || { name: c.name, born: c.born };
  panel(`<h2>СВЕРКА ДОКУМЕНТОВ</h2>
    <div class="docs">
      <div class="doc"><h3>В ДЕЛЕ</h3>${esc(c.name)}<br>Год рождения: ${c.born}<br>Долг: ${esc(fmt(c.debt))}</div>
      <div class="doc"><h3>ПАСПОРТ</h3>${esc(p.name)}<br>Год рождения: ${p.born}<br>Прописка: Заречинск</div>
    </div>
    <p>Данные совпадают?</p>`);
  setActions([
    { label: "Данные совпадают", fn: () => {
      if (c.wrongPerson) { stat("law", -1); S.note = "Вы пропустили несовпадение. Любое изъятие теперь будет незаконным."; } else S.note = "";
      S.phase = "inspect"; run(); } },
    { label: "Не тот человек", cls: "danger", fn: () => {
      if (c.wrongPerson) { stat("law", 2); stat("heart", 1); S.result = { title: "ТЁЗКА НАЙДЕН", text: "Вы вернули дело в банк: это другой Лебедев. Должник пожал вам руку и впервые за неделю улыбнулся.", cash: 0, tags: [["ok", "Закон +2"], ["ok", "Совесть +1"]] }; S.phase = "result"; }
      else { stat("complaints", 1); stat("law", -1); S.note = "Вы зря заподозрили подлог, потеряли время и получили выговор."; S.phase = "inspect"; }
      run(); } }
  ]);
}
function inspect(c) {
  room();
  panel(`<h2>ОПИСЬ ИМУЩЕСТВА</h2>
    ${S.note ? `<div class="note">${esc(S.note)}</div>` : ""}
    <p>Долг: ${esc(fmt(c.debt))}. Выберите вещи для изъятия, нажатие показывает комментарий.</p>
    <div class="grid" id="grid"></div>
    <div class="note" id="note">Нажмите на вещь, чтобы осмотреть её.</div>
    <p id="sum"></p>`);
  const grid = $("#grid");
  c.items.forEach((it, idx) => {
    const b = document.createElement("button"); b.className = "item" + (S.picks.includes(idx) ? " on" : "");
    const cnv = document.createElement("canvas"); cnv.width = 16; cnv.height = 16; drawIcon(cnv, it.k);
    const t = document.createElement("div"); t.textContent = it.n;
    const w = document.createElement("small"); w.textContent = fmt(it.w);
    b.append(cnv, t, w);
    b.addEventListener("click", () => {
      const at = S.picks.indexOf(idx); if (at >= 0) S.picks.splice(at, 1); else S.picks.push(idx);
      b.classList.toggle("on"); $("#note").textContent = it.note; refresh(c); writeSave();
    });
    grid.appendChild(b);
  });
  refresh(c);
}
function refresh(c) {
  const sel = S.picks.map((i) => c.items[i]);
  const sum = sel.reduce((a, b) => a + b.w, 0);
  $("#sum").textContent = `Выбрано: ${sel.length} шт., ${fmt(sum)} из ${fmt(c.debt)}`;
  setActions([
    { label: sel.length ? "Изъять выбранное" : "Ничего не выбрано", cls: "primary", disabled: !sel.length, fn: () => seize(c) },
    { label: "Дать отсрочку на 14 дней", fn: () => defer(c) },
    { label: "Закрыть дело без изъятия", cls: "danger", fn: () => closeCase(c) }
  ]);
}
function seize(c) {
  const sel = S.picks.map((i) => c.items[i]);
  const bad = sel.filter((i) => i.exempt);
  const worth = Math.min(c.debt, sel.reduce((a, b) => a + b.w, 0));
  const tags = []; let cash = worth; let text;
  if (c.wrongPerson) { stat("law", -3); stat("complaints", 2); cash = 0; text = "Вы изъяли имущество у человека, который ничего не должен. Завтра об этом напишут в новостях."; tags.push(["bad", "Закон −3"], ["bad", "Жалобы +2"]); }
  else {
    if (bad.length) { stat("law", -2 * bad.length); stat("complaints", bad.length); cash = Math.max(0, worth - bad.reduce((a, b) => a + b.w, 0)); tags.push(["bad", `Закон −${2 * bad.length}`], ["bad", `Жалобы +${bad.length}`]); text = "Среди вещей оказались защищённые законом: " + bad.map((i) => i.n.toLowerCase()).join(", ") + ". Придётся вернуть и объясняться."; }
    else { stat("law", 1); tags.push(["ok", "Закон +1"]); text = "Опись составлена по закону. Вещи погружены в служебную машину."; }
    if (c.hardship > 0 && sel.some((i) => !i.exempt)) { stat("heart", -c.hardship); tags.push(["bad", `Совесть −${c.hardship}`]); text += " Должник смотрел вам вслед из окна."; }
  }
  stat("cash", cash); S.result = { title: "ИЗЪЯТИЕ", text, cash, tags }; S.phase = "result"; run();
}
function defer(c) {
  const tags = []; let text;
  if (c.hardship === 0) { stat("law", -1); text = "Отсрочка выдана. Через три дня должник блокирует телефон. Вас обвёл вокруг пальца человек в халате."; tags.push(["bad", "Обманули"], ["bad", "Закон −1"]); }
  else { stat("heart", 1); text = "Отсрочка оформлена, взыскатель недоволен, но человек получил передышку."; tags.push(["ok", "Совесть +1"]); }
  S.result = { title: "ОТСРОЧКА", text, cash: 0, tags }; S.phase = "result"; run();
}
function closeCase(c) {
  const tags = []; let text;
  stat("law", -1); tags.push(["bad", "Закон −1"]);
  if (c.hardship === 0) { stat("complaints", 1); tags.push(["bad", "Жалобы +1"]); text = "Закрыть дело без оснований вам не дали: взыскатель добился проверки."; }
  else { stat("heart", 1); tags.push(["ok", "Совесть +1"]); text = "Вы закрыли дело. Формально без оснований, неформально по-человечески. Начальник вздохнул и поставил подпись."; }
  S.result = { title: "ДЕЛО ЗАКРЫТО", text, cash: 0, tags }; S.phase = "result"; run();
}
function resultScreen() {
  const r = S.result; room();
  panel(`<h2>${esc(r.title)}</h2>
    <div>${r.tags.map(([k, t]) => `<span class="tag ${k}">${esc(t)}</span>`).join("")}</div>
    <p>${esc(r.text)}</p>
    <p class="who">${r.cash ? "Взыскано: " + esc(fmt(r.cash)) : "Без взыскания."}</p>`);
  setActions([{ label: "Следующий адрес", cls: "primary", fn: next }]);
}
function next() { S.step += 1; S.phase = "door"; S.picks = []; S.vis = 0; S.note = ""; S.result = null; run(); }

// ----- суд -----
function courtScreen() {
  const v = VISITORS[S.vis];
  if (!v) {
    court(); panel(`<h2>ДЕЖУРСТВО ЗАВЕРШЕНО</h2><p>Смена на входе окончена. Рамка металлодетектора молчит впервые за день.</p>`);
    setActions([{ label: "К следующему адресу", cls: "primary", fn: next }]); return;
  }
  if (S.phase === "door") S.phase = "view";
  if (S.phase === "view") {
    court(v.look);
    panel(`<h2>${esc(v.name)}</h2><p>${esc(v.intro)}</p><q>${esc(v.say)}</q><p class="who">Посетитель ${S.vis + 1} из ${VISITORS.length}</p>`);
    setActions([
      { label: "Пропустить без досмотра", fn: () => allow(v) },
      { label: "Досмотреть сумку", cls: "primary", fn: () => { S.phase = "bag"; run(); } }
    ]);
  } else if (S.phase === "bag") {
    court(v.look);
    panel(`<h2>СОДЕРЖИМОЕ СУМКИ</h2><p>${v.bag.map(esc).join("<br>")}</p>
      ${v.danger ? `<div class="note">Есть предмет, запрещённый к проносу в здание суда.</div>` : `<div class="note">Ничего запрещённого.</div>`}`);
    setActions(v.danger
      ? [{ label: "Изъять опасный предмет и пропустить", cls: "primary", fn: () => confiscate() }, { label: "Не пускать в здание", cls: "danger", fn: () => refuse() }]
      : [{ label: "Извиниться и пропустить", cls: "primary", fn: () => { stat("complaints", 1); courtResult("Человек проходит, ворча: «Из-за вас я опоздал».", [["bad", "Жалобы +1"]]); } }]);
  } else if (S.phase === "courtResult") {
    court(); panel(`<h2>${esc(S.result.title)}</h2><div>${S.result.tags.map(([k, t]) => `<span class="tag ${k}">${esc(t)}</span>`).join("")}</div><p>${esc(S.result.text)}</p>`);
    setActions([{ label: "Следующий", cls: "primary", fn: () => { S.vis += 1; S.phase = "door"; run(); } }]);
  }
}
function courtResult(text, tags, title) { S.result = { title: title || "РЕЗУЛЬТАТ", text, tags }; S.phase = "courtResult"; run(); }
function allow(v) {
  if (v.danger) { stat("safety", -1); stat("law", -1); courtResult("Пропустили. В зале заседаний потом потребуют вызвать наряд. Охрана смотрит на вас молча.", [["bad", "Безопасность −1"], ["bad", "Закон −1"]], "ИНЦИДЕНТ"); }
  else { stat("law", 1); courtResult("Человек прошёл и поблагодарил. Очередь не задержалась.", [["ok", "Закон +1"]]); }
}
function confiscate() { stat("safety", 1); stat("law", 1); courtResult("Предмет изъят под расписку и сдан в камеру хранения. Человек проходит без нарушений.", [["ok", "Безопасность +1"], ["ok", "Закон +1"]]); }
function refuse() { stat("safety", 1); stat("complaints", 1); courtResult("Не пустили, адвокат обещает жалобу, а свидетель вернулся с другим костюмом.", [["ok", "Безопасность +1"], ["bad", "Жалобы +1"]]); }

// ----- итог -----
function summary() {
  desk(); const a = S.stats;
  const cash = Math.min(100, Math.round((a.cash / PLAN) * 100));
  const law = Math.max(0, Math.min(100, 50 + a.law * 8));
  const heart = Math.max(0, Math.min(100, 50 + a.heart * 10));
  const safe = Math.max(0, Math.min(100, 50 + a.safety * 25));
  const score = Math.round((cash + law + heart + safe) / 4);
  const verdict = score >= 75 ? "Образцовый пристав: и закон, и совесть. Начальник даже обещал премию." : score >= 55 ? "Нормальная смена. Закон не пострадал, совесть слегка потёрлась." : score >= 35 ? "Тяжёлый день. К вам придёт проверка, а к вечернему чаю есть пять жалоб." : "Служебное расследование. Рекомендуют сменить работу или хотя бы городок.";
  const bar = (n, v) => `<div class="bar ${v < 40 ? "low" : ""}"><span>${esc(n)}</span><b>${v}%</b><i><span style="width:${v}%"></span></i></div>`;
  panel(`<h2>ИТОГ СМЕНЫ</h2><div class="bars">${bar("План: " + fmt(a.cash) + " из " + fmt(PLAN), cash)}${bar("Законность", law)}${bar("Совесть", heart)}${bar("Безопасность суда", safe)}</div>
    <p>${esc(verdict)}</p><p class="who">Оценка: ${score} из 100 · Жалоб: ${a.complaints}</p>`);
  setActions([{ label: "Сыграть ещё раз", cls: "primary", fn: () => { S = fresh(); run(); } }, { label: "В меню", fn: () => { clearSave(); menu(); } }]);
  clearSave();
}

menu();
</script>
